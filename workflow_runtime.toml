name = "codex"
platform_version = "omnigent 0.8.2 (built 2026-08-04T22:30:54Z)"
command = "/Users/tapasdas/.local/bin/omnigent"

# Relative paths are resolved from the primary repository root. Override for a
# single invocation with MYCODEAGENT_WORKTREE_ROOT.
worktree_root = ".mycodeagent-worktrees"

# Default/top-level supervisor runtime. Per-stage provider routing is pinned in
# coding_agent.yaml: Claude implements and Codex reviews.
harness = "codex"
model = "gpt-5.4-mini"
effort = "medium"

# Console diagnostics. Remove a level to suppress it; persistent task traces
# remain available regardless of this setting.
console_log_levels = ["debug", "info", "error"]

# Append verbose deterministic pytest results to logs/<TASK_ID>_test.log. Set
# to false to disable task test-result logs; lifecycle test status remains.
test_result_logging_enabled = true

# Hard ceiling for a complete supervisor invocation. Successful small tasks
# return as soon as they finish; this limit only protects against a stuck run.
time_limit_seconds = 1800

token_budget = 400000
supervisor_token_budget = 75000
implementer_token_budget = 100000
reviewer_token_budget = 60000

